#cloud-config
# First boot only, with the network open. Everything the agent needs is
# installed now; after this the VM never sees the internet except via leash.
hostname: agent-vm
users:
  - name: dev
    groups: [sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - __PUBKEY__
package_update: true
packages:
  - curl
  - git
  - jq
  - python3
  - python3-pip
  - dnsutils
  - netcat-openbsd
  - iputils-ping
  - nftables
  - iptables
  - ca-certificates
write_files:
  - path: /usr/local/lib/leash/network.sh
    permissions: "0755"
    content: |
__NETWORK_PROBES__
  # Capabilities, not credentials. vm.sh up writes ~/.leash.env each boot.
  - path: /etc/profile.d/zz-leash.sh
    permissions: "0644"
    content: |
      if [ -r "$HOME/.leash.env" ]; then set -a; . "$HOME/.leash.env"; set +a; fi
      case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) PATH="$HOME/.local/bin:$PATH" ;; esac
runcmd:
  - [bash, -c, "[ __CLAUDE__ = 1 ] || exit 0; su - dev -c 'curl -fsSL https://claude.ai/install.sh | bash' || echo 'leash: claude install failed'"]
  - [bash, /usr/local/lib/leash/network.sh, baseline, "__CONTROL_PORT__"]
  # cloud-init tees runcmd output to the serial console, which vm.sh logs.
  - [bash, -c, "echo leash-provision-$(echo done)"]
power_state:
  mode: poweroff
  timeout: 120
  condition: true
