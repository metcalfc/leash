# docker compose up -d --build   (after `make init`)
#
# Requires Docker Engine 28+ for the isolated bridge gateway mode.
# agentnet is internal and isolated: no default route, NAT or host bridge address. The agent
# can reach exactly one thing -- the gateway -- so HTTPS_PROXY is enforcement,
# not a suggestion it can unset.

services:
  leash:
    build: .
    # run/ is written by `make init` on the host, mode 0600, so the gateway
    # runs as you. The Makefile sets these; 10001 is the image's own user.
    user: "${LEASH_UID:-10001}:${LEASH_GID:-10001}"
    environment:
      # Real credentials enter here and nowhere else. Pull them from your
      # keychain at `up` time rather than writing them down, e.g.
      #   ANTHROPIC_API_KEY=$(security find-generic-password -s anthropic -w) docker compose up -d
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./run:/app/run
    networks: [agentnet, egress]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 2s
      retries: 15

  agent:
    build: ./agent
    env_file: ./run/chad-claude.env
    volumes:
      - ./workspace:/work
    networks: [agentnet]
    depends_on:
      leash:
        condition: service_healthy
    stdin_open: true
    tty: true

networks:
  agentnet:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  egress: {}
